tools:
- name: search_catalog
  description: Search for products from the online store using natural language queries and/or filter
    criteria; paginated; conforms to the UCP catalog search capability (dev.ucp.shopping.catalog.search).
- name: get_cart
  description: Get the cart including items, shipping options, discount info, and checkout url for a given
    cart id.
- name: update_cart
  description: Perform updates to a cart, including adding/removing/updating line items, buyer information,
    shipping details, and discounts.
- name: search_shop_policies_and_faqs
  description: Get facts about the store's policies, products, or services.
- name: get_product_details
  description: Look up a product by ID; pass the options parameter to select a specific variant.
