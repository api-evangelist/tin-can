aid: tin-can
name: Tin Can
description: >-
  Tin Can is a Seattle-based consumer hardware company behind a screen-free,
  landline-style Wi-Fi phone for kids — no apps, texting, or games, just voice
  calls with contacts that parents approve through a companion mobile app, with
  free unlimited calling between Tin Can devices. Backed by Greylock (which led
  a $12M round in 2025, bringing total funding to roughly $15.5M). Tin Can
  publishes no first-party developer API; its agent-facing surface is the
  Shopify-hosted storefront, which exposes a live MCP server, a UCP merchant
  profile, an llms.txt, and Shopify Customer Accounts OIDC on the tincan.kids
  domain.
